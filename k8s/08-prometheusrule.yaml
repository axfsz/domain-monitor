apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: domain-monitor-rules
  namespace: monitor
  labels:
    release: monitor
spec:
  groups:
    - name: domain-monitor.rules
      rules:
        - alert: DomainDown
          expr: max by (domain, group) (domain_monitor_up) == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "域名不可用: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} 在分组 {{ $labels.group }} 持续检测失败超过 3 分钟。"
        - alert: DomainSSLCertExpiringSoon
          expr: min by (domain, group) (domain_monitor_ssl_days_left) <= 15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SSL 证书即将过期: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} SSL 证书剩余 {{ $value }} 天。"
        - alert: DomainWhoisExpiringSoon
          expr: min by (domain, group) (domain_monitor_whois_days_left) <= 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "域名注册即将过期: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} 注册有效期剩余 {{ $value }} 天。"
        - alert: DomainHighLatency
          expr: |
            (
              max by (domain, group) (
                avg_over_time(domain_monitor_response_time_ms[30m])
              ) > 8000
            )
            and on(domain, group)
            (
              min by (domain, group) (
                min_over_time(domain_monitor_response_time_ms[30m])
              ) > 5000
            )
            and on(domain, group)
            (
              max by (domain, group) (
                max_over_time(domain_monitor_status_level[30m])
              ) == 0
            )
            and on(domain, group)
            (
              max by (domain, group) (
                count_over_time(domain_monitor_response_time_ms[30m])
              ) >= 10
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "域名持续高延迟: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} 持续 1 小时满足高延迟条件，近 30 分钟平均响应时间超过 8000ms、最低响应时间高于 5000ms，且样本数不少于 10，并未处于其他异常状态。"
