apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: domain-monitor-rules
  namespace: monitor
  labels:
    release: monitor
spec:
  groups:
    - name: domain-monitor.rules
      rules:
        - alert: DomainDown
          expr: domain_monitor_up == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "域名不可用: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} 在探测节点 {{ $labels.agent }} 检测失败超过 3 分钟。"
        - alert: DomainSSLCertExpiringSoon
          expr: domain_monitor_ssl_days_left <= 15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SSL 证书即将过期: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} SSL 证书剩余 {{ $value }} 天。"
        - alert: DomainWhoisExpiringSoon
          expr: domain_monitor_whois_days_left <= 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "域名注册即将过期: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} 注册有效期剩余 {{ $value }} 天。"
        - alert: DomainHighLatency
          expr: |
            (
              avg_over_time(domain_monitor_response_time_ms[10m]) > 5000
            )
            and on(domain, group, agent, region)
            (
              max_over_time(domain_monitor_status_level[10m]) == 0
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "域名响应慢: {{ $labels.domain }}"
            description: "域名 {{ $labels.domain }} 在探测节点 {{ $labels.agent }} 近 10 分钟平均响应时间超过 5000ms，且未处于其他异常状态。"
